name: NexusTravel
options:
  bundleIdPrefix: com.nexustravel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
targets:
  NexusTravel:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nexus Travel
        UIAppFonts:
          - plus_jakarta_sans_regular.ttf
          - plus_jakarta_sans_medium.ttf
          - plus_jakarta_sans_semibold.ttf
          - plus_jakarta_sans_bold.ttf
          - plus_jakarta_sans_extrabold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  NexusTravelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: NexusTravel
